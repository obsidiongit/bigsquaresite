<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- FIG. 002.2, inline figure for /blog/local-seo-with-more-than-one-location/,
     the ownership section: 1 business account owns every profile (the
     solid square), local managers get manager access, never ownership
     (the 20 outline squares hanging from the rail). Light ground. -->
<meta name="figure-viewport" content="1200x675">
<title>blog-fig-gbp-ownership</title>
<style>
  @font-face {
    font-family: "Lenia Mono";
    src: url("../../../public/fonts/LeniaMono-500.woff2") format("woff2");
    font-weight: 500;
  }
  :root {
    --paper: #F5F6F8;
    --mid: #5A6373;
    --ink: #0B0F17;
    --acc: #0657F9;
    --line: rgba(11, 15, 23, .12);
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 675px;
    background: var(--paper);
    position: relative;
    overflow: hidden;
  }
  .label {
    position: absolute;
    font: 500 16px/1.2 "Lenia Mono", monospace;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .stamp { left: 100px; top: 72px; }
  .owner-label { left: 672px; top: 214px; }
  .n20 { left: 100px; top: 560px; }
  /* the owner account */
  .owner {
    position: absolute;
    left: 552px;
    top: 170px;
    width: 96px;
    height: 96px;
    background: var(--acc);
  }
  /* tree hairlines: drop from the owner to a rail, ticks down to each location */
  .drop {
    position: absolute;
    left: 600px;
    top: 266px;
    width: 1px;
    height: 90px;
    background: var(--line);
  }
  .rail {
    position: absolute;
    left: 115px;
    width: 970px; /* spans the centers of squares 1 and 20 */
    top: 356px;
    height: 1px;
    background: var(--line);
  }
  .tick {
    position: absolute;
    top: 356px;
    width: 1px;
    height: 60px;
    background: var(--line);
  }
  /* 20 locations: 30px outline squares, centers every 51px from x=115 */
  .loc {
    position: absolute;
    top: 416px;
    width: 30px;
    height: 30px;
    border: 2px solid var(--acc);
  }
</style>
</head>
<body>
  <span class="label stamp">FIG. 002.2</span>
  <div class="owner"></div>
